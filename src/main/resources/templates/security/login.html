<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login - Codfish Bike Sales & Service</title>
</head>
<body class="bg-light">
<div th:replace='~{/fragments/head.html :: template}'></div>

<div class="container min-vh-100 d-flex align-items-center justify-content-center">
    <div class="row justify-content-center w-100">
        <div class="col-md-6 col-lg-4">
            <div class="text-center mb-4">
                <img th:src="@{/images/logo/logo2.jpg}" alt="Logo" class="img-fluid mb-3" style="max-height: 80px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);">
                <h2 class="fw-bold text-primary">System Login</h2>
                <p class="text-muted small">Enter your credentials to access the portal</p>
            </div>

            <div class="card card-custom border-0 shadow-lg p-4">
                <div class="card-body">
                    <!-- Alert for login errors -->
                    <div th:if="${param.error}" class="alert alert-danger border-0 small mb-4 py-2 px-3">
                        <i class="fas fa-exclamation-circle me-2"></i>Invalid username or password.
                    </div>

                    <!-- Alert for logout success -->
                    <div th:if="${param.logout}" class="alert alert-success border-0 small mb-4 py-2 px-3">
                        <i class="fas fa-check-circle me-2"></i>You have been logged out successfully.
                    </div>

                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label for="username" class="form-label small fw-bold text-uppercase">Username</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="fas fa-user text-muted"></i></span>
                                <input type="text" id="username" name="username" class="form-control border-start-0 ps-0 shadow-none" placeholder="Enter username" required autofocus>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label small fw-bold text-uppercase">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="fas fa-lock text-muted"></i></span>
                                <input type="password" id="password" name="password" class="form-control border-start-0 ps-0 shadow-none" placeholder="Enter password" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold shadow-sm">
                                <i class="fas fa-sign-in-alt me-2"></i>Login to System
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="text-center mt-4">
                <p class="x-small text-muted mb-0">&copy; 2026 Enterprise Edition v2.0</p>
                <p class="x-small text-muted">CodFish Bike Sales & Service</p>
            </div>
        </div>
    </div>
</div>

<style>
    body {
        background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
    }
    .card-custom {
        border-radius: 16px;
        transition: none;
    }
    .card-custom:hover {
        transform: none;
    }
    .input-group-text {
        border-radius: 6px 0 0 6px;
    }
    .form-control {
        border-radius: 0 6px 6px 0;
    }
</style>

</body>
</html>
