<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
</head>
<body>
<header th:fragment="template">
    <nav class="sidebar-custom" id="sidebar">
        <a class="navbar-brand" th:href="@{/}">
            <img th:src="@{/images/logo/logo2.jpg}" alt="Logo">
        </a>
        
        <div class="nav-container">
            <ul class="nav flex-column">
                <li class="nav-item"><a class="nav-link" th:href="@{/salesman}"><i class="fas fa-user-friends me-1"></i>Salesman</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/purchase}"><i class="fas fa-shopping-cart me-1"></i>Sale</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/add_update_salesman}"><i class="fas fa-tasks me-1"></i>Salesmen Mgr</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/service/newBikeService}"><i class="fas fa-tools me-1"></i>Service</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/bike/history}"><i class="fas fa-history me-1"></i>History</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/personRepairing}"><i class="fas fa-user-cog me-1"></i>Repairing</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/add_update_person_repairing}"><i class="fas fa-cogs me-1"></i>Repair Mgr</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/customers_purchases}"><i class="fas fa-users me-1"></i>Customers</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/invoices_purchases}"><i class="fas fa-file-invoice-dollar me-1"></i>Invoices</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/user/info}"><i class="fas fa-user-shield me-1"></i>Users</a></li>
            </ul>
        </div>

        <div class="sidebar-footer">
            <div class="d-flex flex-column align-items-center text-center">
                <span th:if="${globalUsername}" th:text="${globalUsername}" style="color: var(--accent-color); font-weight: 700; font-size: 1rem;">User Name</span>
                <span th:if="${globalUserRole}" th:text="'Role: ' + ${globalUserRole}" class="mb-3" style="color: var(--text-muted, #aaa); font-size: 0.8rem;">Role</span>
                <form action="#" th:action="@{/logout}" method="post" class="w-100">
                    <button class="btn btn-danger w-100 shadow-sm" type="submit">
                        <i class="fas fa-sign-out-alt me-1"></i>Log out
                    </button>
                </form>
            </div>
        </div>
    </nav>
    
    <!-- Mobile Toggle Button (Visible only on smaller screens) -->
    <div class="d-xl-none fixed-top p-3">
        <button class="btn btn-dark shadow" type="button" onclick="toggleSidebar()">
            <i class="fas fa-bars"></i>
        </button>
    </div>
</header>
</body>
</html>
