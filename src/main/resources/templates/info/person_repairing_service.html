<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Repairing Portal</title>
</head>
<body>
<div th:replace='~{/fragments/head.html :: template}'></div>
<div th:replace='~{/fragments/header.html :: template}'></div>

<main class="container py-4 mt-3">
    <!-- Header Section -->
    <div class="row align-items-center mb-4">
        <div class="col-md-6">
            <h2 class="display-6 fw-bold text-primary mb-0">
                <i class="fas fa-tools me-2"></i>Repairing Portal
            </h2>
            <p class="text-muted small">Manage service requests and process bike repairs efficiently.</p>
        </div>
        <div class="col-md-6 text-md-end">
            <div class="d-inline-flex gap-2">
                <a th:href="@{/add_update_parts}" class="btn btn-outline-primary shadow-sm">
                    <i class="fas fa-cogs me-2"></i>Manage Parts
                </a>
                <a th:href="@{/add_update_services}" class="btn btn-outline-primary shadow-sm">
                    <i class="fas fa-wrench me-2"></i>Manage Services
                </a>
                <a th:href="@{/}" class="btn btn-light shadow-sm">
                    <i class="fas fa-home"></i>
                </a>
            </div>
        </div>
    </div>

    <div class="row g-4">
        <!-- Left Column: Queue and Status -->
        <div class="col-lg-4">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-header bg-dark text-white d-flex align-items-center justify-content-between py-3">
                    <h5 class="mb-0 small fw-bold text-uppercase tracking-wider">
                        <i class="fas fa-clipboard-list me-2"></i>Service Queue
                    </h5>
                    <span class="badge bg-primary" th:text="${availableServiceRequestDTOs.size()}">0</span>
                </div>
                <div class="card-body p-0">
                    <div class="list-group list-group-flush scrollarea" style="max-height: 600px; overflow-y: auto;">
                        <div th:if="${#lists.isEmpty(availableServiceRequestDTOs)}" class="p-4 text-center text-muted">
                            <i class="fas fa-check-circle fa-3x mb-3 opacity-25"></i>
                            <p>No open requests!</p>
                        </div>
                        <div th:each="serviceRequest : ${availableServiceRequestDTOs}" 
                             class="list-group-item list-group-item-action py-3 lh-tight border-start border-4"
                             th:classappend="${serviceRequestStat.first} ? 'border-primary' : 'border-light'"
                             data-fill-form=".col-lg-8 form"
                             th:data-bike-serial="${serviceRequest.bikeSerial}"
                             style="cursor: pointer;">
                            <div class="d-flex w-100 align-items-center justify-content-between mb-1">
                                <strong class="mb-1" th:text="${serviceRequest.bikeServiceRequestNumber}">#REQ-001</strong>
                                <small class="text-muted" th:text="${serviceRequest.receivedDateTime}">2023-10-01</small>
                            </div>
                            <div class="col-10 mb-1 small">
                                <span class="badge bg-info text-dark mb-1" th:text="${serviceRequest.bikeSerial}">SN12345</span>
                                <div class="text-truncate text-muted" th:text="${serviceRequest.customerComment}">Comment...</div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="card-footer bg-light text-center py-2">
                    <small class="text-muted">Currently active requests</small>
                </div>
            </div>
        </div>

        <!-- Right Column: Processing Form -->
        <div class="col-lg-8">
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-primary text-white py-3">
                    <h5 class="mb-0 fw-bold"><i class="fas fa-play-circle me-2"></i>Active Repair Task</h5>
                </div>
                <div class="card-body p-4">
                    <!-- Error Message Display -->
                    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                        <i class="fas fa-exclamation-triangle me-2"></i>
                        <span th:text="${errorMessage}">Error Message</span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>

                    <form action="#" th:action="@{/personRepairing/workUnit}" th:object="${bikeServiceProcessDTO}" th:method="POST">
                        
                        <!-- Assignment Section -->
                        <div class="row g-3 mb-4 p-3 bg-light rounded-3 border">
                            <div class="col-md-6">
                                <label for="personRepairingCodeNameSurname" class="form-label fw-bold small text-uppercase">Technician</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white"><i class="fas fa-user-cog text-primary"></i></span>
                                    <select id="personRepairingCodeNameSurname" name="personRepairingCodeNameSurname" th:field="*{personRepairingCodeNameSurname}" class="form-select shadow-none">
                                        <option th:each="availablePersonRepairingCodeNameSurname : ${availablePersonRepairingCodeNameSurnames}"
                                                th:value="${availablePersonRepairingCodeNameSurname}"
                                                th:text="${availablePersonRepairingCodeNameSurname}"></option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label for="bikeSerial" class="form-label fw-bold small text-uppercase">Bike Serial Number</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white"><i class="fas fa-bicycle text-primary"></i></span>
                                    <select id="bikeSerial" name="bikeSerial" th:field="*{bikeSerial}" class="form-select shadow-none">
                                        <option th:each="availableBikeSerial : ${availableBikeSerials}"
                                                th:value="${availableBikeSerial}"
                                                th:text="${availableBikeSerial}"></option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <!-- Parts Section -->
                        <div class="section-container mb-4">
                            <div class="d-flex justify-content-between align-items-center mb-3 border-bottom pb-2">
                                <h6 class="fw-bold mb-0"><i class="fas fa-puzzle-piece me-2 text-warning"></i>Parts Used</h6>
                                <button type="button" class="btn btn-sm btn-outline-success rounded-pill" id="addPartBtn">
                                    <i class="fas fa-plus me-1"></i>Add Part
                                </button>
                            </div>
                            <div id="partsContainer">
                                <!-- Dynamic rows added by JS -->
                            </div>
                        </div>

                        <!-- Services Section -->
                        <div class="section-container mb-4">
                            <div class="d-flex justify-content-between align-items-center mb-3 border-bottom pb-2">
                                <h6 class="fw-bold mb-0"><i class="fas fa-concierge-bell me-2 text-info"></i>Services Performed</h6>
                                <button type="button" class="btn btn-sm btn-outline-info rounded-pill" id="addServiceBtn">
                                    <i class="fas fa-plus me-1"></i>Add Service
                                </button>
                            </div>
                            <div id="servicesContainer">
                                <!-- Dynamic rows added by JS -->
                            </div>
                        </div>

                        <!-- Conclusion Section -->
                        <div class="row g-3">
                            <div class="col-12">
                                <label for="personRepairingComment" class="form-label fw-bold small text-uppercase">Final Remarks / Comments</label>
                                <textarea id="personRepairingComment" th:field="*{personRepairingComment}" class="form-control" rows="3" placeholder="Describe the work done..."></textarea>
                            </div>
                            <div class="col-12">
                                <div class="card bg-light border-0 mb-3">
                                    <div class="card-body py-2 px-3">
                                        <label class="form-label d-block fw-bold mb-1 small text-uppercase">Final Status</label>
                                        <div class="form-check form-check-inline">
                                            <input class="form-check-input" type="radio" id="doneYes" th:value="true" th:field="*{done}">
                                            <label class="form-check-label text-success fw-bold small" for="doneYes">Completed</label>
                                        </div>
                                        <div class="form-check form-check-inline">
                                            <input class="form-check-input" type="radio" id="doneNo" th:value="false" th:field="*{done}">
                                            <label class="form-check-label text-warning fw-bold small" for="doneNo">In Progress</label>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="col-12 text-end">
                                <button type="submit" class="btn btn-primary btn-lg px-5 shadow">
                                    <i class="fas fa-save me-2"></i>Save Progress
                                </button>
                            </div>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript remains consistent but with updated templates -->
    <script th:inline="javascript">
        /*<![CDATA[*/
        document.addEventListener('DOMContentLoaded', function() {
            console.log("DOM Content Loaded - Initializing Repairing Portal JS");
            if (typeof window.setupServiceForm === 'function') {
                window.setupServiceForm({
                    partsContainerId: 'partsContainer',
                    addPartBtnId: 'addPartBtn',
                    partDTOs: /*[[${partDTOs}]]*/ [],
                    servicesContainerId: 'servicesContainer',
                    addServiceBtnId: 'addServiceBtn',
                    serviceDTOs: /*[[${serviceDTOs}]]*/ []
                });
            } else {
                console.error("setupServiceForm not found! Check if scripts.js is loaded correctly.");
            }
        });
        /*]]>*/
    </script>
</main>

<div th:replace='~{/fragments/footer.html :: template}'></div>

<style>
    .scrollarea { overflow-y: auto; }
    .card { border-radius: 12px; }
    .tracking-wider { letter-spacing: 0.05em; }
    .section-container { background: #fcfcfc; padding: 15px; border-radius: 10px; border: 1px solid #eee; }
    .list-group-item { transition: all 0.2s; }
    .list-group-item:hover { background-color: #f8f9fa; transform: translateX(5px); }
</style>

</body>
</html>
