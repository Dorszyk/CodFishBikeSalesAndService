<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
</head>
<body>
<div th:replace='~{/fragments/head.html :: template}'></div>
<div th:replace='~{/fragments/header.html :: template}'></div>

<main class="container py-5 mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8 text-center">
            <div class="card card-custom shadow-sm p-5">
                <div class="mb-4 text-success">
                    <i class="fas fa-file-invoice-dollar fa-5x"></i>
                </div>
                <h2 class="mb-4">Sale Completed!</h2>
                <p class="text-muted mb-4">New customer registered and bike sold successfully.</p>
                
                <div class="alert alert-success bg-light border-0 py-4 mb-4 text-start">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <small class="text-muted d-block">Bike Serial</small>
                            <strong th:text="${bikeSerial}">BIKE</strong>
                        </div>
                        <div class="col-md-6">
                            <small class="text-muted d-block">Invoice Number</small>
                            <strong th:text="${invoiceNumber}">INVOICE NUMBER</strong>
                        </div>
                        <div class="col-12">
                            <small class="text-muted d-block">New Customer</small>
                            <strong th:text="${customerName + ' ' + customerSurname}">NAME</strong>
                        </div>
                        <div class="col-md-6">
                            <small class="text-muted d-block">Phone</small>
                            <span th:text="${customerPhone}">PHONE</span>
                        </div>
                        <div class="col-md-6">
                            <small class="text-muted d-block">Location</small>
                            <span th:text="${customerAddressStreet} + ' ' + ${customerAddressHouseNumber} + (${customerAddressApartmentNumber} != null and ${customerAddressApartmentNumber} != '' ? '/' + ${customerAddressApartmentNumber} : '')">Street</span>
                            <span class="d-block" th:text="${customerAddressPostalCode} + ' ' + ${customerAddressCity}">Postal Code, City</span>
                        </div>
                    </div>
                </div>

                <div class="d-flex justify-content-center gap-2 mt-4">
                    <a th:href="@{/purchase}" class="btn btn-primary px-4 shadow-sm">
                        <i class="fas fa-plus me-2"></i>New Sale
                    </a>
                    <a th:href="@{/invoices_purchases}" class="btn btn-outline-info px-4 shadow-sm">
                        <i class="fas fa-list me-2"></i>View Invoices
                    </a>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace='~{/fragments/footer.html :: template}'></div>
</body>
</html>
