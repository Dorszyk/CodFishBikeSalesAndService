<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Parts Management</title>
</head>
<body>
<div th:replace='~{/fragments/head.html :: template}'></div>
<div th:replace='~{/fragments/header.html :: template}'></div>

<main class="container py-4 mt-3">
    <!-- Header Section -->
    <div class="row align-items-center mb-4">
        <div class="col-md-7">
            <h2 class="display-6 fw-bold text-primary mb-0">
                <i class="fas fa-cogs me-2"></i>Parts Management
            </h2>
            <p class="text-muted small">Add, update, or remove bike parts from the inventory catalog.</p>
        </div>
        <div class="col-md-5 text-md-end">
            <div class="d-inline-flex gap-2">
                <a th:href="@{/personRepairing}" class="btn btn-outline-secondary shadow-sm">
                    <i class="fas fa-arrow-left me-2"></i>Back to Portal
                </a>
            </div>
        </div>
    </div>

    <div class="row g-4">
        <!-- Left Column: Parts List -->
        <div class="col-lg-7">
            <div class="card border-0 shadow-sm mb-4">
                <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center py-3">
                    <h5 class="mb-0 small fw-bold text-uppercase tracking-wider">
                        <i class="fas fa-boxes me-2"></i>Parts Inventory
                    </h5>
                    <div class="d-flex align-items-center gap-2 w-50">
                        <div class="input-group input-group-sm">
                            <span class="input-group-text bg-white border-end-0"><i class="fas fa-search text-muted"></i></span>
                            <input type="text" id="searchInputParts" class="form-control border-start-0 ps-0 shadow-none" placeholder="Filter parts..." data-search-target="#parts-table">
                        </div>
                    </div>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover table-sm mb-0 align-middle" id="parts-table">
                            <thead class="table-light">
                            <tr>
                                <th class="ps-3">Serial Number</th>
                                <th>Description</th>
                                <th class="text-end">Price</th>
                                <th class="text-center">Actions</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="part : ${availablePartsDTOs}" class="part-row" style="cursor: pointer;"
                                data-fill-form="#update-pane form"
                                data-tab-target="#update-tab"
                                th:data-serial="${part.serialNumber}"
                                th:data-description="${part.description}"
                                th:data-price="${part.price}"
                                th:data-update_serial="${part.serialNumber}"
                                th:data-update_description="${part.description}"
                                th:data-update_price="${part.price}">
                                <td class="ps-3 fw-bold text-primary" th:text="${part.serialNumber}">SN-001</td>
                                <td th:text="${part.description}">Part Description</td>
                                <td class="text-end fw-bold" th:text="${part.price} + ' zł'">100.00 zł</td>
                                <td class="text-center">
                                    <form th:action="@{/delete_part}" th:method="DELETE" class="d-inline">
                                        <input type="hidden" name="serialNumber" th:value="${part.serialNumber}"/>
                                        <button type="submit" class="btn btn-link text-danger p-0 shadow-none" onclick="return confirm('Are you sure you want to remove this part?')">
                                            <i class="fas fa-trash"></i>
                                        </button>
                                    </form>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
                <div class="card-footer bg-white border-top-0 py-2">
                    <div id="pagination-container-parts" class="d-flex justify-content-center mt-2"></div>
                </div>
            </div>
        </div>

        <!-- Right Column: Forms -->
        <div class="col-lg-5">
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-primary text-white p-0">
                    <ul class="nav nav-tabs nav-fill border-0" id="partsTabs" role="tablist">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link active text-white fw-bold py-3 border-0 rounded-0" id="add-tab" data-bs-toggle="tab" data-bs-target="#add-pane" type="button" role="tab">
                                <i class="fas fa-plus-circle me-1"></i>Add Part
                            </button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link text-white fw-bold py-3 border-0 rounded-0" id="update-tab" data-bs-toggle="tab" data-bs-target="#update-pane" type="button" role="tab">
                                <i class="fas fa-edit me-1"></i>Update Part
                            </button>
                        </li>
                    </ul>
                </div>
                <div class="card-body p-4">
                    <div class="tab-content">
                        <!-- Add Form -->
                        <div class="tab-pane fade show active" id="add-pane" role="tabpanel">
                            <form th:action="@{/add_part}" th:object="${partDTO}" th:method="POST" class="row g-3">
                                <div class="col-12">
                                    <label class="form-label small fw-bold text-uppercase">Serial Number</label>
                                    <input type="text" class="form-control shadow-none" name="serialNumber" placeholder="e.g. SN-12345" required>
                                </div>
                                <div class="col-12">
                                    <label class="form-label small fw-bold text-uppercase">Description</label>
                                    <input type="text" class="form-control shadow-none" name="description" placeholder="Part description" required>
                                </div>
                                <div class="col-12">
                                    <label class="form-label small fw-bold text-uppercase">Price (PLN)</label>
                                    <input type="number" step="0.01" class="form-control shadow-none" name="price" placeholder="0.00" required>
                                </div>
                                <div class="col-12 mt-4">
                                    <button type="submit" class="btn btn-success w-100 shadow-sm">
                                        <i class="fas fa-save me-2"></i>Add to Catalog
                                    </button>
                                </div>
                            </form>
                        </div>

                        <!-- Update Form -->
                        <div class="tab-pane fade" id="update-pane" role="tabpanel">
                            <div class="alert alert-warning py-2 px-3 mb-4 border-0 small">
                                <i class="fas fa-mouse-pointer me-2"></i>Select a part from the inventory to edit.
                            </div>
                            <form th:action="@{/update_part}" th:object="${partDTO}" th:method="PUT" class="row g-3">
                                <div class="col-12">
                                    <label class="form-label small fw-bold text-uppercase text-danger">Target Serial Number</label>
                                    <input type="text" class="form-control shadow-none border-danger bg-light" id="update_serial" name="serialNumber" readonly required>
                                </div>
                                <div class="col-12">
                                    <label class="form-label small fw-bold text-uppercase">New Description</label>
                                    <input type="text" class="form-control shadow-none" id="update_description" name="description" required>
                                </div>
                                <div class="col-12">
                                    <label class="form-label small fw-bold text-uppercase">New Price (PLN)</label>
                                    <input type="number" step="0.01" class="form-control shadow-none" id="update_price" name="price" required>
                                </div>
                                <div class="col-12 mt-4">
                                    <button type="submit" class="btn btn-warning w-100 shadow-sm fw-bold">
                                        <i class="fas fa-sync-alt me-2"></i>Update Part
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace='~{/fragments/footer.html :: template}'></div>

<style>
    .card { border-radius: 12px; }
    .nav-tabs .nav-link { transition: all 0.3s; opacity: 0.7; }
    .nav-tabs .nav-link.active { opacity: 1; background: rgba(255,255,255,0.1) !important; border-bottom: 3px solid white !important; }
    .nav-tabs .nav-link:hover { opacity: 1; background: rgba(255,255,255,0.05); }
    .tracking-wider { letter-spacing: 0.05em; }
    .part-row { transition: all 0.2s; }
    .part-row:hover { background-color: #f0f7ff !important; }
    .table-primary { background-color: #e7f1ff !important; }
</style>

</body>
</html>
