<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>User Profile</title>
</head>
<body>
<div th:replace='~{/fragments/head.html :: template}'></div>
<div th:replace='~{/fragments/header.html :: template}'></div>

<main class="container py-5 mt-3">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card border-0 shadow-lg overflow-hidden">
                <div class="card-header bg-primary text-white py-4 text-center">
                    <div class="mb-3">
                        <i class="fas fa-user-circle fa-5x shadow-sm rounded-circle"></i>
                    </div>
                    <h3 class="mb-0 fw-bold" th:text="${username}">USER_NAME</h3>
                    <p class="text-white-50 small mb-0">System User Profile</p>
                </div>
                <div class="card-body p-4">
                    <div class="row g-4">
                        <div class="col-12">
                            <label class="form-label small fw-bold text-uppercase text-muted tracking-wider mb-2">Account Details</label>
                            <ul class="list-group list-group-flush border rounded-3 overflow-hidden">
                                <li class="list-group-item d-flex justify-content-between align-items-center py-3">
                                    <div class="d-flex align-items-center">
                                        <i class="fas fa-envelope text-primary me-3"></i>
                                        <span class="fw-bold">Email</span>
                                    </div>
                                    <span class="text-muted" th:text="${email} ?: 'N/A'">user@example.com</span>
                                </li>
                                <li class="list-group-item d-flex justify-content-between align-items-center py-3">
                                    <div class="d-flex align-items-center">
                                        <i class="fas fa-id-badge text-primary me-3"></i>
                                        <span class="fw-bold">User Roles</span>
                                    </div>
                                    <div>
                                        <span th:each="authority : ${authorities}"
                                              class="badge bg-primary-subtle text-primary border border-primary-subtle ms-1"
                                              th:text="${authority.authority}">ROLE</span>
                                    </div>
                                </li>
                                <li class="list-group-item d-flex justify-content-between align-items-center py-3">
                                    <div class="d-flex align-items-center">
                                        <i class="fas fa-toggle-on text-primary me-3"></i>
                                        <span class="fw-bold">Account Status</span>
                                    </div>
                                    <span th:class="${enabled} ? 'badge bg-success' : 'badge bg-danger'"
                                          th:text="${enabled} ? 'ACTIVE' : 'INACTIVE'"></span>
                                </li>
                                <li class="list-group-item d-flex justify-content-between align-items-center py-3">
                                    <div class="d-flex align-items-center">
                                        <i class="fas fa-sign-in-alt text-primary me-3"></i>
                                        <span class="fw-bold">Last Login</span>
                                    </div>
                                    <span class="text-muted" th:if="${lastLogin != null}" th:text="${#temporals.format(lastLogin, 'yyyy-MM-dd HH:mm:ss')}">2026-01-01 12:00:00</span>
                                    <span class="text-muted" th:if="${lastLogin == null}">First session</span>
                                </li>
                                <li class="list-group-item d-flex justify-content-between align-items-center py-3">
                                    <div class="d-flex align-items-center">
                                        <i class="fas fa-clock text-muted me-3"></i>
                                        <span>Expired</span>
                                    </div>
                                    <span class="badge bg-light text-dark border" th:text="${accountNonExpired} ? 'NO' : 'YES'"></span>
                                </li>
                                <li class="list-group-item d-flex justify-content-between align-items-center py-3">
                                    <div class="d-flex align-items-center">
                                        <i class="fas fa-lock text-muted me-3"></i>
                                        <span>Locked</span>
                                    </div>
                                    <span class="badge bg-light text-dark border" th:text="${accountNonLocked} ? 'NO' : 'YES'"></span>
                                </li>
                                <li class="list-group-item d-flex justify-content-between align-items-center py-3">
                                    <div class="d-flex align-items-center">
                                        <i class="fas fa-key text-muted me-3"></i>
                                        <span>Credentials Expired</span>
                                    </div>
                                    <span class="badge bg-light text-dark border" th:text="${credentialsNonExpired} ? 'NO' : 'YES'"></span>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>
                <div class="card-footer bg-light border-top-0 text-center py-4">
                    <a th:href="@{/}" class="btn btn-outline-primary px-4 shadow-sm">
                        <i class="fas fa-home me-2"></i>Dashboard
                    </a>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace='~{/fragments/footer.html :: template}'></div>

<style>
    .card { border-radius: 15px; }
    .tracking-wider { letter-spacing: 0.05em; }
    .list-group-item { border-left: none; border-right: none; }
    .fa-user-circle { background: white; color: #0d6efd; }
</style>

</body>
</html>
